<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a
        {
            width: 200px;
            height: 200px;
            border: 5px solid;
            background-image: linear-gradient(220deg, blue,red,violet);
        }

         .b
        {
            width: 200px;
            height: 200px;
            background-image: radial-gradient(yellow,green 25%,orange 50%,pink)
        }

        .c
        {
            width: 200px;
            height: 200px;
            background-image: conic-gradient(yellow,green ,orange)
        }
        .d
        {
            border: 2px solid;
            width: 80px;
            /* padding-left: 20px;
            padding-top: 20px;
            padding-right: 20px;
            padding-bottom: 20px; */
            padding: 20px 30px 50px 40px ;
        }
        #x
        {
            text-shadow: 10px -10px 5px blue;
        }
        #y
        {
            border: 2px solid;
            width: 80px;
            box-shadow: 5px 5px 2px red;
        }
        img
        {
            filter: drop-shadow(5px 5px 3px yellow);
        }
        .x
        {
            text-align: center;
            text-decoration: underline;
            text-transform: capitalize;
            /* text-transform: lowercase; */
            letter-spacing: 2px;
            line-height: 50px;
            text-indent: 20px;
            word-spacing: 20px;
        }
    </style>
</head>
<body>
    <div class="a"></div><br><br>
    <div class="b"></div><br><br>
    <div class="c"></div><br><br>
    <br><br>
<h1 class="d">Hello</h1>

<h1 id="x">Java</h1>
<h2 id="y">Python</h2>
<img src="wall1.jpg" alt="" width="200px" height="200px">

<h1 class="x">Hii I am kokila Janarthanan</h1>
</body>
</html>
