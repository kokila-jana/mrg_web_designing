<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p
        {
            width: 300px;
        }
        div
        {
            width: 500px;
            height: 500px;
            border: 3px solid;
        }
         @media screen and (max-width:765px) 
         {
            div
            {
                width: 200px;
            }
            p
            {
                color: red;
            }
         }
         @media screen and (min-width:768px) and (max-width:991px)
         {
            div
            {
                background-color: aqua;
            }
            p
            {
                color: olive;
            }
         }
    </style>
</head>
<body>
    <div>
        <img src="10018.jpg" alt="" width="500px" height="300px">
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Fuga rerum optio placeat? Doloremque error asperiores aliquam eveniet enim? Quaerat sequi voluptatibus, cum itaque eos aspernatur tenetur fugiat doloremque inventore consequuntur.</p>
    </div>
</body>
</html>
